name: catalog update

# Every Monday, and on request. Project Amber mirrors the game's data within
# days of a patch, and patches land about every six weeks, so a weekly look is
# cheap and never late by more than a few days. Amber also picks up reworks of
# existing characters, which is why it is the source rather than a package
# whose version number could say whether anything moved.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Enka first: `data:yatta` discovers new characters from its store,
      # since Amber's list trails a release by a few days.
      - run: pnpm data:enka

      - run: pnpm data:yatta

      - run: pnpm data:build

      # Nothing downstream should run when the catalogue has not moved. There
      # is no version to compare, so the output itself is compared, without
      # `meta.json`: it carries a timestamp, and would otherwise open an empty
      # pull request every week.
      - id: diff
        name: Did the catalog change?
        run: |
          if git diff --quiet -- src/generated/data ':(exclude)src/generated/data/meta.json' \
            && [ -z "$(git ls-files --others --exclude-standard -- src/generated/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The catalog is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "game=$(node -p "require('./src/generated/data/meta.json').gameVersion")" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/generated/data
          fi

      # The guards that decide whether this is a pull request or a bug report.
      # A patch can rename an asset, add an item whose GOOD key collides, or
      # retire an id the curated priorities still name, and each of those is
      # invisible until somebody loads the page it breaks.
      # Reads Genshin Optimizer's own id maps, so an upstream outage fails the
      # run and no pull request is opened that week. Re-run by hand from the
      # Actions tab rather than weakening the check.
      - if: steps.diff.outputs.changed == 'true'
        name: The derived GOOD keys still agree with upstream
        run: pnpm data:check-good

      # Reports rather than gates: it samples the host, and one 404 is as
      # likely to be an asset that has not been uploaded yet as a name this
      # build got wrong. Read it in the run log before merging.
      - if: steps.diff.outputs.changed == 'true'
        name: Do the icon names resolve on the asset host?
        run: pnpm data:check-assets

      - if: steps.diff.outputs.changed == 'true'
        run: pnpm typecheck

      - if: steps.diff.outputs.changed == 'true'
        run: pnpm lint

      # Includes the check that every id in the generated build priorities
      # still exists in the catalogue.
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm test

      # One standing branch: a week whose pull request is still open updates
      # it rather than opening a second one beside it.
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/update
          add-paths: src/generated/data
          commit-message: |
            chore: regenerate the catalog from Project Amber (game ${{ steps.diff.outputs.game }})

            Characters, weapons, artifacts and materials as Amber has them
            this week, reworks of existing characters included. The generated
            output is committed so that `next build` never touches the network.
          title: 'chore: catalog from Project Amber (game ${{ steps.diff.outputs.game }})'
          body: |
            `src/generated/data` rebuilt from Project Amber and Enka's store,
            game ${{ steps.diff.outputs.game }}.

            Green here means the GOOD crosswalk still agrees with upstream, the
            icon names still resolve, and every id the curated build priorities
            name still exists. What it cannot tell you is whether a new
            mechanic needs an annotation — the diff below is the place to look
            for characters and sets this app has no opinion about yet, and for
            reworked text on characters it already knows.

            Player data is unaffected: it stores the game's numeric ids, and a
            patch adds ids rather than repointing them.
          labels: catalog
          delete-branch: true
